name: Build GDLibrary Flutter Web

on:
  push:
    branches:
      - chatgpt/deploy-gdlibrary
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get

      - name: Build original Flutter Web project
        run: flutter build web --release

      - name: Upload original Flutter Web build
        uses: actions/upload-artifact@v4
        with:
          name: GDLibrary_D_1672-flutter-web
          path: build/web
          if-no-files-found: error
